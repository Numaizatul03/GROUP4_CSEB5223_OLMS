# Continuous integration (Assignment Part 1, Section 9):
# every push and pull request is syntax-checked and tested before it can be merged into main.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite

      - name: Check PHP syntax
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php tests/run_tests.php
